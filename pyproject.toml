[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gsa-experiments"
version = "0.1.0"
description = "Geno-Synthetic Algorithm experiment battery"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "matplotlib>=3.8",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "rich>=13.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "pytest-cov>=4.1"]
extra = ["pymoo>=0.6", "ioh>=0.3", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
